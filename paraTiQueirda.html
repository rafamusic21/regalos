<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti, querida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Nunito+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #FFFBF1;
    --cream-deep: #FBF3DE;
    --ink: #3F3421;
    --ink-soft: #6B5D42;
    --gold: #E9AE12;
    --gold-deep: #C98F0A;
    --petal: #F8D65A;
    --leaf: #7C8F55;
    --leaf-deep: #5E7040;
    --line: rgba(63,52,33,0.14);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Nunito Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    background:
      radial-gradient(circle at 18% 8%, var(--cream-deep) 0%, transparent 45%),
      radial-gradient(circle at 85% 92%, var(--cream-deep) 0%, transparent 40%),
      var(--cream);
  }

  .page{
    width:100%;
    max-width:480px;
    padding:0 0 64px;
    position:relative;
  }

  /* drifting background petals */
  .petal-field{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
  }
  .drift{
    position:absolute;
    width:16px;
    height:16px;
    opacity:0.55;
    animation:driftA 24s linear infinite;
  }
  .drift svg{ width:100%; height:100%; display:block; }
  .drift.sm{ width:10px; height:10px; }
  .drift.lg{ width:20px; height:20px; }
  .drift.alt{ animation-name:driftB; }

  .drift.d1{ left:6%;  top:-6%;  animation-delay:0s;   animation-duration:23s; }
  .drift.d2{ left:22%; top:-9%;  animation-delay:9s;   animation-duration:29s; }
  .drift.d3{ left:38%; top:-4%;  animation-delay:4s;   animation-duration:26s; }
  .drift.d4{ left:54%; top:-11%; animation-delay:14s;  animation-duration:22s; }
  .drift.d5{ left:68%; top:-7%;  animation-delay:2s;   animation-duration:31s; }
  .drift.d6{ left:80%; top:-10%; animation-delay:11s;  animation-duration:25s; }
  .drift.d7{ left:90%; top:-5%;  animation-delay:6s;   animation-duration:33s; }
  .drift.d8{ left:12%; top:-13%; animation-delay:17s;  animation-duration:27s; }

  @keyframes driftA{
    0%  { transform:translateY(-10vh) translateX(0)    rotate(0deg); }
    50% { transform:translateY(52vh)  translateX(5vw)  rotate(150deg); }
    100%{ transform:translateY(115vh) translateX(-3vw) rotate(300deg); }
  }
  @keyframes driftB{
    0%  { transform:translateY(-10vh) translateX(0)    rotate(0deg); }
    50% { transform:translateY(48vh)  translateX(-6vw) rotate(-140deg); }
    100%{ transform:translateY(115vh) translateX(4vw)  rotate(-280deg); }
  }

  .content{
    position:relative;
    z-index:1;
    padding:0 28px;
  }

  /* hero */
  .hero{
    padding-top:56px;
    text-align:center;
  }

  .bouquet{
    width:min(96%, 400px);
    margin:0 auto;
    opacity:0;
    transform:translateY(8px) scale(0.96);
    animation:reveal 1.1s cubic-bezier(.2,.7,.2,1) 0.15s forwards;
  }
  .bouquet svg{ width:100%; height:auto; display:block; overflow:visible; }

  @keyframes reveal{
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .petal-bloom{
    transform-origin:0 0;
    transform:scale(0.2);
    opacity:0;
    animation:bloom 0.7s cubic-bezier(.34,1.4,.4,1) forwards;
  }
  @keyframes bloom{
    to{ transform:scale(1); opacity:1; }
  }
  .f1 .petal-bloom{ animation-delay:0.5s; }
  .f2 .petal-bloom{ animation-delay:0.75s; }
  .f3 .petal-bloom{ animation-delay:0.95s; }

  .stem-draw{
    stroke-dasharray:140;
    stroke-dashoffset:140;
    animation:draw 0.9s ease-out 0.25s forwards;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  .date-pill{
    display:inline-block;
    margin:26px auto 0;
    padding:8px 20px;
    border:1px solid var(--line);
    border-radius:999px;
    font-size:14px;
    letter-spacing:0.02em;
    color:var(--ink-soft);
    background:rgba(255,255,255,0.5);
    opacity:0;
    animation:fadeUp 0.7s ease-out 1.15s forwards;
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  h1{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:clamp(30px, 8vw, 40px);
    line-height:1.2;
    margin:22px 0 0;
    color:var(--ink);
    opacity:0;
    animation:fadeUp 0.8s ease-out 1.3s forwards;
  }

  .lede{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:500;
    font-size:17px;
    color:var(--gold-deep);
    margin:10px 0 0;
    opacity:0;
    animation:fadeUp 0.8s ease-out 1.45s forwards;
  }

  /* divider */
  .divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:44px 0 34px;
  }
  .divider .line{
    flex:1;
    height:1px;
    background:var(--line);
  }
  .divider svg{ width:20px; height:20px; flex-shrink:0; }

  /* short note */
  .note{
    text-align:center;
    font-size:17px;
    line-height:1.6;
    color:var(--ink);
    max-width:320px;
    margin:0 auto;
  }

  .signoff{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size:19px;
    color:var(--gold-deep);
    margin-top:16px;
    display:block;
  }

  /* small pressed-flower footer */
  .footer{
    text-align:center;
    margin-top:46px;
  }
  .footer svg{ width:56px; height:56px; }
  .footer p{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:10px;
  }

  @media (prefers-reduced-motion: reduce){
    .bouquet, .petal-bloom, .stem-draw, .date-pill, h1, .lede, .drift{
      animation:none !important;
      opacity:1 !important;
      transform:none !important;
      stroke-dashoffset:0 !important;
    }
  }
</style>
</head>
<body>

  <div class="petal-field" aria-hidden="true">
    <div class="drift d1">
      <svg viewBox="0 0 20 20"><path d="M10,14 C5,11 3,6 7,2 C8,1 12,1 13,2 C17,6 15,11 10,14 Z" fill="#FCE58B"/></svg>
    </div>
    <div class="drift d2 alt sm">
      <svg viewBox="0 0 20 20"><path d="M10,14 C5,11 3,6 7,2 C8,1 12,1 13,2 C17,6 15,11 10,14 Z" fill="#E8A317"/></svg>
    </div>
    <div class="drift d3 lg">
      <svg viewBox="0 0 20 20"><path d="M10,14 C5,11 3,6 7,2 C8,1 12,1 13,2 C17,6 15,11 10,14 Z" fill="#F0BA2E"/></svg>
    </div>
    <div class="drift d4 alt">
      <svg viewBox="0 0 20 20"><path d="M10,14 C5,11 3,6 7,2 C8,1 12,1 13,2 C17,6 15,11 10,14 Z" fill="#FCE58B"/></svg>
    </div>
    <div class="drift d5 sm">
      <svg viewBox="0 0 20 20"><path d="M10,14 C5,11 3,6 7,2 C8,1 12,1 13,2 C17,6 15,11 10,14 Z" fill="#C98F0A"/></svg>
    </div>
    <div class="drift d6 alt lg">
      <svg viewBox="0 0 20 20"><path d="M10,14 C5,11 3,6 7,2 C8,1 12,1 13,2 C17,6 15,11 10,14 Z" fill="#E8A317"/></svg>
    </div>
    <div class="drift d7">
      <svg viewBox="0 0 20 20"><path d="M10,14 C5,11 3,6 7,2 C8,1 12,1 13,2 C17,6 15,11 10,14 Z" fill="#F0BA2E"/></svg>
    </div>
    <div class="drift d8 alt sm">
      <svg viewBox="0 0 20 20"><path d="M10,14 C5,11 3,6 7,2 C8,1 12,1 13,2 C17,6 15,11 10,14 Z" fill="#FCE58B"/></svg>
    </div>
  </div>

  <div class="page">
    <div class="content">

      <div class="hero">
        <div class="bouquet">
          <svg viewBox="0 0 300 320" xmlns="http://www.w3.org/2000/svg">

            <defs>
              <linearGradient id="petalOuter" x1="0" y1="1" x2="0.2" y2="0">
                <stop offset="0%"  stop-color="#E8A317"/>
                <stop offset="100%" stop-color="#FCE58B"/>
              </linearGradient>
              <linearGradient id="petalMid" x1="0" y1="1" x2="0.2" y2="0">
                <stop offset="0%"  stop-color="#C98F0A"/>
                <stop offset="100%" stop-color="#F0BA2E"/>
              </linearGradient>
              <linearGradient id="petalInner" x1="0" y1="1" x2="0.2" y2="0">
                <stop offset="0%"  stop-color="#8B5E0A"/>
                <stop offset="100%" stop-color="#D9A521"/>
              </linearGradient>
              <path id="petalLg" d="M0,-2 C -15,-11 -20,-27 -10,-41
                                     C -4,-46 4,-46 10,-41
                                     C 20,-27 15,-11 0,-2 Z"/>
              <path id="petalMd" d="M0,-2 C -11,-9 -15,-21 -8,-32
                                     C -3,-36 3,-36 8,-32
                                     C 15,-21 11,-9 0,-2 Z"/>
              <path id="petalSm" d="M0,-1 C -7,-6 -9,-14 -5,-20
                                     C -2,-23 2,-23 5,-20
                                     C 9,-14 7,-6 0,-1 Z"/>
            </defs>

            <!-- stems -->
            <path class="stem-draw" d="M150 260 C 140 210, 108 190, 95 150" fill="none" stroke="var(--leaf-deep)" stroke-width="4" stroke-linecap="round"/>
            <path class="stem-draw" d="M150 260 C 150 205, 150 180, 150 130" fill="none" stroke="var(--leaf-deep)" stroke-width="4" stroke-linecap="round"/>
            <path class="stem-draw" d="M150 260 C 160 210, 192 190, 208 155" fill="none" stroke="var(--leaf-deep)" stroke-width="4" stroke-linecap="round"/>

            <!-- leaves -->
            <path d="M120 210 C 100 205, 88 218, 84 236 C 106 236, 122 228, 120 210 Z" fill="var(--leaf)"/>
            <path d="M182 215 C 202 210, 214 224, 216 240 C 194 240, 178 232, 182 215 Z" fill="var(--leaf)"/>

            <!-- ribbon -->
            <path d="M120 250 C 140 268, 160 268, 182 250" fill="none" stroke="var(--gold-deep)" stroke-width="5" stroke-linecap="round"/>

            <!-- flower left -->
            <g transform="translate(95 150) rotate(-10) scale(0.62)">
              <g class="f1 petal-bloom">
                <g fill="url(#petalOuter)" stroke="var(--gold-deep)" stroke-opacity="0.22" stroke-width="0.6">
                  <use href="#petalLg" transform="rotate(0)"/>
                  <use href="#petalLg" transform="rotate(51)"/>
                  <use href="#petalLg" transform="rotate(102)"/>
                  <use href="#petalLg" transform="rotate(153)"/>
                  <use href="#petalLg" transform="rotate(204)"/>
                  <use href="#petalLg" transform="rotate(255)"/>
                  <use href="#petalLg" transform="rotate(306)"/>
                </g>
                <g fill="url(#petalMid)" stroke="var(--gold-deep)" stroke-opacity="0.28" stroke-width="0.5" transform="rotate(25)">
                  <use href="#petalMd" transform="rotate(0)"/>
                  <use href="#petalMd" transform="rotate(60)"/>
                  <use href="#petalMd" transform="rotate(120)"/>
                  <use href="#petalMd" transform="rotate(180)"/>
                  <use href="#petalMd" transform="rotate(240)"/>
                  <use href="#petalMd" transform="rotate(300)"/>
                </g>
                <g fill="url(#petalInner)" transform="rotate(10)">
                  <use href="#petalSm" transform="rotate(0)"/>
                  <use href="#petalSm" transform="rotate(72)"/>
                  <use href="#petalSm" transform="rotate(144)"/>
                  <use href="#petalSm" transform="rotate(216)"/>
                  <use href="#petalSm" transform="rotate(288)"/>
                </g>
                <ellipse cx="0" cy="-3" rx="4" ry="6" fill="#6B3F04" opacity="0.5"/>
              </g>
            </g>

            <!-- flower center, largest -->
            <g transform="translate(150 116) rotate(4)">
              <g class="f2 petal-bloom">
                <g fill="url(#petalOuter)" stroke="var(--gold-deep)" stroke-opacity="0.22" stroke-width="0.6">
                  <use href="#petalLg" transform="rotate(0)"/>
                  <use href="#petalLg" transform="rotate(51)"/>
                  <use href="#petalLg" transform="rotate(102)"/>
                  <use href="#petalLg" transform="rotate(153)"/>
                  <use href="#petalLg" transform="rotate(204)"/>
                  <use href="#petalLg" transform="rotate(255)"/>
                  <use href="#petalLg" transform="rotate(306)"/>
                </g>
                <g fill="url(#petalMid)" stroke="var(--gold-deep)" stroke-opacity="0.28" stroke-width="0.5" transform="rotate(25)">
                  <use href="#petalMd" transform="rotate(0)"/>
                  <use href="#petalMd" transform="rotate(60)"/>
                  <use href="#petalMd" transform="rotate(120)"/>
                  <use href="#petalMd" transform="rotate(180)"/>
                  <use href="#petalMd" transform="rotate(240)"/>
                  <use href="#petalMd" transform="rotate(300)"/>
                </g>
                <g fill="url(#petalInner)" transform="rotate(10)">
                  <use href="#petalSm" transform="rotate(0)"/>
                  <use href="#petalSm" transform="rotate(72)"/>
                  <use href="#petalSm" transform="rotate(144)"/>
                  <use href="#petalSm" transform="rotate(216)"/>
                  <use href="#petalSm" transform="rotate(288)"/>
                </g>
                <ellipse cx="0" cy="-3" rx="4.5" ry="7" fill="#6B3F04" opacity="0.5"/>
              </g>
            </g>

            <!-- flower right -->
            <g transform="translate(208 155) rotate(12) scale(0.55)">
              <g class="f3 petal-bloom">
                <g fill="url(#petalOuter)" stroke="var(--gold-deep)" stroke-opacity="0.22" stroke-width="0.6">
                  <use href="#petalLg" transform="rotate(0)"/>
                  <use href="#petalLg" transform="rotate(51)"/>
                  <use href="#petalLg" transform="rotate(102)"/>
                  <use href="#petalLg" transform="rotate(153)"/>
                  <use href="#petalLg" transform="rotate(204)"/>
                  <use href="#petalLg" transform="rotate(255)"/>
                  <use href="#petalLg" transform="rotate(306)"/>
                </g>
                <g fill="url(#petalMid)" stroke="var(--gold-deep)" stroke-opacity="0.28" stroke-width="0.5" transform="rotate(25)">
                  <use href="#petalMd" transform="rotate(0)"/>
                  <use href="#petalMd" transform="rotate(60)"/>
                  <use href="#petalMd" transform="rotate(120)"/>
                  <use href="#petalMd" transform="rotate(180)"/>
                  <use href="#petalMd" transform="rotate(240)"/>
                  <use href="#petalMd" transform="rotate(300)"/>
                </g>
                <g fill="url(#petalInner)" transform="rotate(10)">
                  <use href="#petalSm" transform="rotate(0)"/>
                  <use href="#petalSm" transform="rotate(72)"/>
                  <use href="#petalSm" transform="rotate(144)"/>
                  <use href="#petalSm" transform="rotate(216)"/>
                  <use href="#petalSm" transform="rotate(288)"/>
                </g>
                <ellipse cx="0" cy="-3" rx="4" ry="6" fill="#6B3F04" opacity="0.5"/>
              </g>
            </g>

          </svg>
        </div>

        <span class="date-pill">21 de septiembre</span>
        <h1>Para ti, querida</h1>
        <p class="lede">unas flores amarillas, para que sepas que pensé en ti</p>
      </div>

      <div class="divider" aria-hidden="true">
        <span class="line"></span>
        <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="3" fill="var(--gold-deep)"/><g fill="var(--petal)"><ellipse cx="10" cy="4" rx="3" ry="5"/><ellipse cx="10" cy="16" rx="3" ry="5"/><ellipse cx="4" cy="10" rx="5" ry="3"/><ellipse cx="16" cy="10" rx="5" ry="3"/></g></svg>
        <span class="line"></span>
      </div>

      <p class="note">
        Simples, cálidas, y de esas que alegran el día sin proponérselo.
        <span class="signoff">con cariño</span>
      </p>

      <div class="footer">
        <svg viewBox="0 0 60 60" aria-hidden="true">
          <g fill="var(--petal)">
            <ellipse cx="30" cy="14" rx="9" ry="16"/>
            <ellipse cx="30" cy="46" rx="9" ry="16"/>
            <ellipse cx="46" cy="30" rx="16" ry="9"/>
            <ellipse cx="14" cy="30" rx="16" ry="9"/>
          </g>
          <circle cx="30" cy="30" r="10" fill="var(--gold-deep)"/>
        </svg>
        <p>hecho con cariño para un 21 de septiembre</p>
      </div>

    </div>
  </div>
</body>
</html>
